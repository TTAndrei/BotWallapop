<title>Cazador Wallapop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: lista de fichas tipo "etiqueta de precio" en rejilla; barra de filtros fija arriba. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #1b1f1c;
  --muted: #5d665f;
  --line: #d9ddd6;
  --accent: #1f6f4a;
  --accent-ink: #ffffff;
  --deal: #b4461b;
  --local: #1f6f4a;
  --away: #8a5a00;
  --chip-bg: #eceee9;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1b201d; --ink: #e8ece8; --muted: #9ba59d; --line: #2d3530;
    --accent: #5cc08f; --accent-ink: #0d1a13; --deal: #f08a5d; --local: #5cc08f; --away: #e0b25a;
    --chip-bg: #252b27; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1b201d; --ink: #e8ece8; --muted: #9ba59d; --line: #2d3530;
  --accent: #5cc08f; --accent-ink: #0d1a13; --deal: #f08a5d; --local: #5cc08f; --away: #e0b25a;
  --chip-bg: #252b27; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2 { font-family: var(--display); letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.7rem; font-weight: 800; }
h2 { font-size: 1.25rem; font-weight: 700; }
.sub { color: var(--muted); margin: 4px 0 0; font-variant-numeric: tabular-nums; }

details.msgs { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
details.msgs summary { cursor: pointer; font-weight: 700; }
.msgs .fields { display: grid; gap: 12px; margin-top: 12px; }
.msgs label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.msgs textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 64px; resize: vertical; }
.msgs .hint { font-size: .8rem; color: var(--muted); margin: 0; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .toggle {
  font: inherit; font-size: .88rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 12px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.toggle { display: inline-flex; gap: 6px; align-items: center; }
.toggle input { accent-color: var(--accent); }
.range { display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; }
.range input { font: inherit; width: 4.5em; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-variant-numeric: tabular-nums; }
.range .clear { font: inherit; font-size: .82rem; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.done { opacity: .62; }
.photo { aspect-ratio: 4 / 3; max-width: 100%; width: 100%; object-fit: cover; display: block; background: var(--chip-bg); }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.price { font-family: var(--display); font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: baseline; }
.deal { font-family: var(--body); font-size: .75rem; font-weight: 700; color: var(--deal); text-transform: uppercase; letter-spacing: .06em; }
.title { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.place { color: var(--muted); font-size: .88rem; margin: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); }
.chip.local { color: var(--local); font-weight: 700; }
.chip.away { color: var(--away); font-weight: 700; }
.preview { font-size: .82rem; color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.actions { margin-top: auto; padding-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pick { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; cursor: pointer; }
.pick input { width: 18px; height: 18px; accent-color: var(--accent); }
.go {
  margin-left: auto; text-decoration: none; font-weight: 700; font-size: .9rem; border-radius: 8px; padding: 8px 12px;
  background: var(--accent); color: var(--accent-ink);
}
.undo { font: inherit; font-size: .82rem; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }
.fallback { font: inherit; font-size: .82rem; width: 100%; min-height: 70px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.empty { color: var(--muted); padding: 24px 0; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: .9rem;
}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="wrap">
  <header>
    <h1 id="heading">Cazador Wallapop</h1>
    <p class="sub" id="summary"></p>
  </header>

  <details class="msgs" id="msgs">
    <summary>Mensaje para el vendedor</summary>
    <div class="fields">
      <label for="msg-local">Si está en Cataluña (para quedar en mano)
        <textarea id="msg-local"></textarea>
      </label>
      <label for="msg-fuera">Si está fuera de Cataluña (pregunta por el envío)
        <textarea id="msg-fuera"></textarea>
      </label>
      <p class="hint">{titulo} y {precio} se cambian por los del anuncio. Los cambios se guardan en este dispositivo.</p>
    </div>
  </details>

  <div class="bar">
    <div class="seg" id="seg" role="group" aria-label="Qué ofertas mostrar"></div>
    <label class="toggle" for="only-local"><input type="checkbox" id="only-local"> Solo Cataluña</label>
    <div class="range" role="group" aria-label="Precio">
      <label for="price-min">Precio</label>
      <input id="price-min" type="number" inputmode="numeric" min="0" step="5" placeholder="mín" aria-label="Precio mínimo en euros">
      <span aria-hidden="true">–</span>
      <input id="price-max" type="number" inputmode="numeric" min="0" step="5" placeholder="máx" aria-label="Precio máximo en euros">
      <span>€</span>
      <button type="button" class="clear" id="price-clear" hidden>quitar</button>
    </div>
  </div>

  <main id="results"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const DATA = /*__DATA__*/null;

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};
const picked = new Set(store.get("picked", []));
const contacted = store.get("contacted", {});
let view = store.get("view", "all");
let onlyLocal = store.get("onlyLocal", false);

const $ = (id) => document.getElementById(id);
const msgLocal = $("msg-local"), msgFuera = $("msg-fuera");
msgLocal.value = store.get("msgLocal", DATA.messages.local);
msgFuera.value = store.get("msgFuera", DATA.messages.fuera);
msgLocal.addEventListener("input", () => { store.set("msgLocal", msgLocal.value); render(); });
msgFuera.addEventListener("input", () => { store.set("msgFuera", msgFuera.value); render(); });
$("only-local").checked = onlyLocal;
$("only-local").addEventListener("change", (e) => { onlyLocal = e.target.checked; store.set("onlyLocal", onlyLocal); render(); });

const allItems = DATA.searches.flatMap((s) => s.items);
const priceOf = (item) => parseFloat(item.price);

// Filtro de precio: se guarda en este dispositivo.
const priceMin = $("price-min"), priceMax = $("price-max"), priceClear = $("price-clear");
const prices = allItems.map(priceOf).filter((p) => !Number.isNaN(p));
if (prices.length) {
  priceMin.placeholder = Math.floor(Math.min(...prices));
  priceMax.placeholder = Math.ceil(Math.max(...prices));
}
priceMin.value = store.get("priceMin", "");
priceMax.value = store.get("priceMax", "");
function onPrice() {
  store.set("priceMin", priceMin.value); store.set("priceMax", priceMax.value); render();
}
priceMin.addEventListener("input", onPrice);
priceMax.addEventListener("input", onPrice);
priceClear.addEventListener("click", () => { priceMin.value = ""; priceMax.value = ""; onPrice(); });

function visible(item) {
  if (onlyLocal && !item.local) return false;
  const p = priceOf(item), lo = parseFloat(priceMin.value), hi = parseFloat(priceMax.value);
  if (!Number.isNaN(lo) && !(p >= lo)) return false;
  if (!Number.isNaN(hi) && !(p <= hi)) return false;
  return true;
}
const total = allItems.length;
$("heading").textContent = DATA.searches.map((s) => s.name).join(" · ") || "Cazador Wallapop";
$("summary").textContent = `${total} ofertas tras filtrar · ` +
  DATA.searches.map((s) => s.median ? `mediana ${Math.round(s.median)} €` : "").filter(Boolean).join(" · ") +
  ` · buscado el ${DATA.generated}`;

function messageFor(item) {
  const tpl = item.local ? msgLocal.value : msgFuera.value;
  return tpl.replaceAll("{titulo}", item.title).replaceAll("{precio}", item.price);
}

const VIEWS = [
  ["all", "Todas", () => true],
  ["picked", "Me interesan", (i) => picked.has(i.id)],
  ["todo", "Por contactar", (i) => picked.has(i.id) && !contacted[i.id]],
  ["done", "Contactadas", (i) => !!contacted[i.id]],
];

function renderSeg() {
  const seg = $("seg");
  seg.replaceChildren(...VIEWS.map(([key, label, test]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = `${label} (${allItems.filter((i) => test(i) && visible(i)).length})`;
    b.setAttribute("aria-pressed", String(view === key));
    b.addEventListener("click", () => { view = key; store.set("view", view); render(); });
    return b;
  }));
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node.setAttribute(k, v);
  }
  node.append(...children.filter(Boolean));
  return node;
}

function card(item) {
  const isPicked = picked.has(item.id), done = contacted[item.id];
  const node = el("article", { class: `card${isPicked ? " picked" : ""}${done ? " done" : ""}` });
  const img = item.image ? el("img", { class: "photo", src: item.image, alt: "", loading: "lazy" }) : el("div", { class: "photo" });

  const pick = el("input", { type: "checkbox", id: `pick-${item.id}` });
  pick.checked = isPicked;
  pick.addEventListener("change", () => {
    pick.checked ? picked.add(item.id) : picked.delete(item.id);
    store.set("picked", [...picked]); render();
  });

  const msg = messageFor(item);
  const actions = el("div", { class: "actions" }, el("label", { class: "pick", for: `pick-${item.id}` }, pick, "Me interesa"));
  if (done) {
    const undo = el("button", { class: "undo", type: "button", text: "deshacer" });
    undo.addEventListener("click", () => { delete contacted[item.id]; store.set("contacted", contacted); render(); });
    actions.append(el("span", { class: "chip", text: `Contactada ${done}` }), undo);
  }
  const go = el("a", { class: "go", href: item.url, target: "_blank", rel: "noopener", text: done ? "Abrir anuncio" : "Copiar mensaje y abrir" });
  go.addEventListener("click", () => {
    const markDone = () => {
      picked.add(item.id);
      contacted[item.id] = new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" });
      store.set("picked", [...picked]); store.set("contacted", contacted);
      setTimeout(render, 300);
    };
    if (done) return;
    const copied = navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject();
    copied.then(() => { toast("Mensaje copiado. Pégalo en el chat del anuncio."); markDone(); }, () => {
      const area = el("textarea", { class: "fallback", readonly: "" });
      area.value = msg;
      node.querySelector(".body").append(area);
      area.focus(); area.select();
      toast("No se pudo copiar solo: mantén pulsado el texto y cópialo.");
      markDone();
    });
  });
  actions.append(go);

  node.append(
    img,
    el("div", { class: "body" },
      el("div", { class: "price" }, item.price, item.deal ? el("span", { class: "deal", text: "chollo" }) : null),
      el("p", { class: "title", text: item.title }),
      el("p", { class: "place", text: item.place }),
      el("div", { class: "chips" },
        el("span", { class: `chip ${item.local ? "local" : "away"}`, text: item.local ? "Cataluña · en mano" : "Fuera · pedir envío" }),
        item.shipping ? el("span", { class: "chip", text: "Acepta envío" }) : null),
      el("p", { class: "preview", text: `«${msg}»` }),
      actions));
  return node;
}

function render() {
  renderSeg();
  priceClear.hidden = !priceMin.value && !priceMax.value;
  const test = VIEWS.find(([key]) => key === view)[2];
  const sections = DATA.searches.map((s) => {
    const items = s.items.filter((i) => test(i) && visible(i));
    const grid = el("div", { class: "grid" });
    grid.append(...items.map(card));
    return el("section", {},
      DATA.searches.length > 1 ? el("h2", { text: s.name }) : null,
      items.length ? grid : el("p", { class: "empty", text: emptyText() }));
  });
  $("results").replaceChildren(...sections);
}

function emptyText() {
  if (view === "picked") return "Aún no has marcado ninguna. Marca «Me interesa» en las que te gusten.";
  if (view === "todo") return "No queda ninguna marcada sin contactar.";
  if (view === "done") return "Todavía no has contactado con ningún vendedor.";
  return "No hay ofertas con estos filtros.";
}

let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}

render();
</script>
